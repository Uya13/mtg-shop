name: mtg-shop-tests
services:
  test_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tester
      POSTGRES_DB: mtg_test
      POSTGRES_PASSWORD: test-only-password
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U tester -d mtg_test']
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
  tests:
    image: mtg-shop-tests:${TEST_IMAGE_TAG:-local}
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://tester:test-only-password@test_db/mtg_test
    depends_on:
      test_db:
        condition: service_healthy
    command: [sh, -c, 'ruff check app tests && ruff format --check app tests && python -m pytest -q']
